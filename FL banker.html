<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Banker</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto 20px; }
    .hidden { display: none; }
    .icon-picker { display: flex; gap: 10px; margin: 10px 0; }
    .icon-opt { font-size: 24px; cursor: pointer; padding: 5px; border: 2px solid transparent; border-radius: 8px; }
    .icon-opt.selected { border-color: #007bff; background: #e7f1ff; }
    .player-row { border-bottom: 1px solid #eee; padding: 10px 0; }
    .player-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .badge { font-size: 11px; background: #eee; padding: 2px 6px; border-radius: 4px; color: #555; }
    .history { font-size: 13px; color: #666; margin-top: 8px; padding-left: 10px; background: #fafafa; border-radius: 6px; }
    .gain { color: green; } .spend { color: red; }
    button { background: #007bff; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    select, input { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- SCREEN 1: LANDING / CREATE PARTY -->
  <div id="landingScreen" class="card">
    <h2>Game Banker</h2>
    <p>Start a new game session or join an existing party.</p>
    <button onclick="createParty()">Create New Party</button>
  </div>

  <!-- SCREEN 2: JOIN PARTY FORM -->
  <div id="joinScreen" class="card hidden">
    <h2>Join Party</h2>
    <label>Your Name:</label>
    <input type="text" id="usernameInput" placeholder="Enter username">
    
    <label>Choose Your Avatar:</label>
    <div class="icon-picker">
      <span class="icon-opt selected" onclick="selectIcon('👑', this)">👑</span>
      <span class="icon-opt" onclick="selectIcon('🦊', this)">🦊</span>
      <span class="icon-opt" onclick="selectIcon('🚀', this)">🚀</span>
      <span class="icon-opt" onclick="selectIcon('🎲', this)">🎲</span>
      <span class="icon-opt" onclick="selectIcon('🏆', this)">🏆</span>
    </div>

    <button onclick="joinParty()">Enter Game</button>
  </div>

  <!-- SCREEN 3: GAME DASHBOARD -->
  <div id="gameScreen" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">Party Dashboard</h3>
      <button style="width:auto; padding:5px 10px;" onclick="copyPartyLink()">Share Link 🔗</button>
    </div>
    
    <!-- COMMISSIONER PANEL -->
    <div id="commissionerPanel" class="hidden" style="background: #fff8e6; padding: 12px; border-radius: 8px; margin: 15px 0; border: 1px solid #ffe58f;">
      <h4 style="margin-top:0;">👑 Commissioner Controls</h4>
      <label>Target Player:</label>
      <select id="targetPlayerSelect"></select>

      <label>Type:</label>
      <select id="txTypeSelect" onchange="toggleCategorySelect()">
        <option value="gain">Gained (+)</option>
        <option value="spend">Spent (-)</option>
        <option value="correction">Correction / Undo</option>
      </select>

      <div id="categoryWrapper">
        <label>Reason:</label>
        <select id="txCategorySelect">
          <option value="Salary">Salary</option>
          <option value="Action">Action</option>
          <option value="Vacation">Vacation</option>
        </select>
      </div>

      <label>Amount ($):</label>
      <input type="number" id="txAmountInput" placeholder="0.00" min="0">

      <button onclick="submitTransaction()">Process Transaction</button>
    </div>

    <!-- PLAYERS LIST -->
    <h4>Players & Balances</h4>
    <div id="playersList"></div>
  </div>

  <!-- FIREBASE LIBRARIES -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // YOUR EXPLICIT FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyDZ-3G6UmQCCIHsBFKEiE5JT12j4pMb_lw",
      authDomain: "fl-banker.firebaseapp.com",
      databaseURL: "https://fl-banker-default-rtdb.firebaseio.com",
      projectId: "fl-banker",
      storageBucket: "fl-banker.firebasestorage.app",
      messagingSenderId: "509146812119",
      appId: "1:509146812119:web:d0db8f0d4f6fe043c6a92",
      measurementId: "G-60RESZS239"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let partyId = new URLSearchParams(window.location.search).get("room");
    let myUserId = localStorage.getItem("game_user_id");
    let selectedIcon = "👑";

    window.selectIcon = (icon, el) => {
      selectedIcon = icon;
      document.querySelectorAll('.icon-opt').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
    };

    window.createParty = () => {
      const newPartyRef = push(ref(db, 'parties'));
      partyId = newPartyRef.key;
      window.location.search = `?room=${partyId}`;
    };

    window.joinParty = () => {
      const name = document.getElementById("usernameInput").value.trim();
      if (!name) return alert("Please enter a username");

      if (!myUserId) {
        myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem("game_user_id", myUserId);
      }

      const playerRef = ref(db, `parties/${partyId}/players/${myUserId}`);
      
      onValue(ref(db, `parties/${partyId}/commissioner`), (snapshot) => {
        const commissionerId = snapshot.val();
        let isComm = false;
        if (!commissionerId) {
          set(ref(db, `parties/${partyId}/commissioner`), myUserId);
          isComm = true;
        } else if (commissionerId === myUserId) {
          isComm = true;
        }

        set(playerRef, {
          name: name,
          icon: selectedIcon,
          role: isComm ? "Commissioner / FL Player" : "FL Player",
          balance: 0
        });

        document.getElementById("joinScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");
        listenToGame();
      }, { onlyOnce: true });
    };

    function listenToGame() {
      onValue(ref(db, `parties/${partyId}`), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const isComm = data.commissioner === myUserId;
        document.getElementById("commissionerPanel").classList.toggle("hidden", !isComm);

        const playersDiv = document.getElementById("playersList");
        const select = document.getElementById("targetPlayerSelect");
        playersDiv.innerHTML = "";
        select.innerHTML = "";

        const players = data.players || {};
        const transactions = data.history || {};

        Object.keys(players).forEach(id => {
          const p = players[id];
          
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = `${p.icon} ${p.name}`;
          select.appendChild(opt);

          let historyHtml = "";
          Object.values(transactions)
            .filter(t => t.targetId === id)
            .forEach(t => {
              const sign = t.type === 'gain' ? '+' : '-';
              const css = t.type === 'gain' ? 'gain' : 'spend';
              historyHtml += `<div class="${css}">${sign}$${t.amount} (${t.category})</div>`;
            });

          const isMe = id === myUserId;
          const playerEl = document.createElement("div");
          playerEl.className = "player-row";
          playerEl.innerHTML = `
            <div class="player-header" onclick="toggleHistory('${id}')">
              <div>
                <span>${p.icon} <strong>${p.name}</strong></span> 
                <span class="badge">${p.role}</span>
              </div>
              <div><strong>$${p.balance.toFixed(2)}</strong></div>
            </div>
            ${isMe ? `<div id="hist_${id}" class="history">${historyHtml || 'No transactions yet.'}</div>` : ''}
          `;
          playersDiv.appendChild(playerEl);
        });
      });
    }

    window.toggleHistory = (id) => {
      const el = document.getElementById(`hist_${id}`);
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };

    window.toggleCategorySelect = () => {
      const type = document.getElementById("txTypeSelect").value;
      document.getElementById("categoryWrapper").style.display = type === 'correction' ? 'none' : 'block';
    };

    window.submitTransaction = () => {
      const targetId = document.getElementById("targetPlayerSelect").value;
      const type = document.getElementById("txTypeSelect").value;
      const category = type === 'correction' ? 'Correction' : document.getElementById("txCategorySelect").value;
      const amount = parseFloat(document.getElementById("txAmountInput").value);

      if (!amount || amount <= 0) return alert("Enter a valid amount");

      onValue(ref(db, `parties/${partyId}/players/${targetId}/balance`), (snap) => {
        let currentBal = snap.val() || 0;
        let newBal = currentBal;

        if (type === 'gain') newBal += amount;
        else if (type === 'spend' || type === 'correction') newBal -= amount;

        update(ref(db, `parties/${partyId}/players/${targetId}`), { balance: newBal });
        
        push(ref(db, `parties/${partyId}/history`), {
          targetId: targetId,
          type: type,
          category: category,
          amount: amount,
          timestamp: Date.now()
        });

        document.getElementById("txAmountInput").value = "";
      }, { onlyOnce: true });
    };

    window.copyPartyLink = () => {
      navigator.clipboard.writeText(window.location.href);
      alert("Party link copied to clipboard!");
    };

    if (partyId) {
      document.getElementById("landingScreen").classList.add("hidden");
      document.getElementById("joinScreen").classList.remove("hidden");
    }
  </script>
</body>
</html>
